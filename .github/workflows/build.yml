name: build

# 分支推送 / PR / 手动触发都跑「测试 + 四个 APK」，打 v* tag 时额外发 Release。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的新推送取消上一次未跑完的构建：APK 构建耗时长，排队等旧任务没意义。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 tool/env.sh 里本机使用的 SDK 保持同一版本：pubspec 要求 flutter >=3.44.0、
  # Dart ^3.12.0，换版本可能直接解不开依赖。
  FLUTTER_VERSION: 3.44.9
  # Android Gradle Plugin 需要 JDK 17（本机用的也是 java-17-openjdk）。
  JAVA_VERSION: '17'

jobs:
  # ── 快门：分析 + 单测。不过这关就不浪费十几分钟去构建 APK。 ──────────────────
  test:
    name: 分析与单测
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test --reporter expanded

  # ── 四个 APK：universal + arm64-v8a + armeabi-v7a + x86_64 ──────────────────
  build-apk:
    name: 构建四个 APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 打 v* tag 时最后一步要建 Release，必须能写仓库内容。GITHUB_TOKEN 在新仓库
    # 默认是只读的，不显式声明会在发布那一步 403（前面的构建全跑完才失败，最亏）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 拉取依赖
        run: flutter pub get

      - name: 读取版本号
        id: version
        run: echo "value=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      # 直接复用本机打包脚本：它负责两次构建、签名校验、四件套完整性闸门，
      # 缺任何一个包都会非零退出。CI 与本机因此不会出现「口径不一致」。
      # env.sh 检测到 CI=true 会跳过本机 SDK 路径与国内镜像设置。
      - name: 打包（复用 tool/build-apk.sh）
        run: ./tool/build-apk.sh

      - name: 核对产物清单
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          echo "期望四个版本：universal / arm64-v8a / armeabi-v7a / x86_64"
          for name in universal arm64-v8a armeabi-v7a x86_64; do
            f="dist/jellfin-$version-$name.apk"
            [[ -s "$f" ]] || { echo "::error::缺少 $f"; exit 1; }
            printf '  %-40s %s\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
          done
          count=$(ls -1 dist/jellfin-"$version"-*.apk | wc -l)
          [[ "$count" -eq 4 ]] || { echo "::error::期望 4 个 APK，实际 $count 个"; exit 1; }
          echo "四个版本齐全 ✓"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jellfin-${{ steps.version.outputs.value }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # 打 v* tag 才发 Release，普通推送只留 artifact。
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
